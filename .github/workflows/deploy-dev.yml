name: Deploy Admin Dev to Firebase Hosting

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-hosting-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: project-b722be7d-f120-42aa-be3
          workload_identity_provider: projects/247826757722/locations/global/workloadIdentityPools/github-pool/providers/github-admin-fe-provider
          service_account: github-action-1211156084@project-b722be7d-f120-42aa-be3.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting
        run: >
          npx firebase-tools deploy
          --only hosting
          --project project-b722be7d-f120-42aa-be3
          --non-interactive